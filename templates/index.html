<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Bezpieczna Strona - Projekt</title>
    <style>
        body { background: #0d1117; color: white; text-align: center; font-family: sans-serif; padding-top: 100px; }
        .box { border: 2px solid #238636; padding: 40px; display: inline-block; border-radius: 12px; background: #161b22; }
        h1 { color: #00ffa3; }
        button { background: #238636; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2ea043; }
    </style>
</head>
<body>
    <div class="box">
        <h1>System Bezpieczny</h1>
        <p>Amelia & Piotr</p>
        <form action="/upload" method="POST" enctype="multipart/form-data">
            <input type="file" name="file" required><br><br>
            <button type="submit">ZWERYFIKUJ I WYŚLIJ PLIK</button>
        </form>
    </div>
</body>
</html>
